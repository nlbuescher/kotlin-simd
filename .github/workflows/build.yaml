name: Build

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy artifacts
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            os: ubuntu-latest
          - target: macosX64
            os: macos-26-intel
          - target: mingwX64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Run check task
        run: ./gradlew check --stacktrace

      - name: Run publish task
        run: ./gradlew smartPublish --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: staging-deploy-${{ matrix.target }}
          path: build/staging-deploy/*

  deploy:
    name: Deploy
    needs: build
    if: ${{ success() && (inputs.deploy || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: staging-deploy-*
          path: build/staging-deploy
          merge-multiple: true

      - name: Deploy artifacts
        run: ./gradlew jreleaserDeploy --stacktrace
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_NEXUS2_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
