name: Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            os: ubuntu-latest
          - target: macosX64
            os: macos-26-intel
          - target: mingwX64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.4
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
          xcodebuild -version

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Test
        run: ./gradlew check --stacktrace

      - name: Prepare artifacts
        run: ./gradlew smartPublish --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: staging-deploy-${{ matrix.target }}
          path: build/staging-deploy/*
